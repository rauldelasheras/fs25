<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="FS25 Checklist">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="theme-color" content="#f5f5f7">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icon-180.png">
  <title>FS25 · Checklist diario</title>

  <style>
    :root{
      --bg:#f5f5f7;
      --card:#ffffff;
      --text:#1d1d1f;
      --muted:#6e6e73;
      --line:#e5e5ea;
      --accent:#0a7f3f;
      --accent-soft:#e9f7ef;
      --sage:#6f736c;
      --sage-soft:#eef0ec;
      --danger:#d6453d;
      --shadow:0 2px 14px rgba(0,0,0,.06);
    }

    *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
    html,body{
      margin:0;
      background:var(--bg);
      color:var(--text);
      font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",sans-serif;
    }

    body{
      min-height:100vh;
      padding:max(16px,env(safe-area-inset-top))
              max(14px,env(safe-area-inset-right))
              max(96px,env(safe-area-inset-bottom))
              max(14px,env(safe-area-inset-left));
    }

    .app{width:min(760px,100%);margin:0 auto}

    header{margin:6px 2px 16px}
    h1{
      margin:0;
      font-size:clamp(28px,7vw,40px);
      line-height:1.05;
      letter-spacing:-.03em;
    }

    button,input{font:inherit}

    button{
      border:0;
      border-radius:14px;
      background:var(--text);
      color:#fff;
      min-height:44px;
      padding:10px 14px;
      font-weight:750;
      cursor:pointer;
    }

    button:active{transform:scale(.98)}
    button.secondary{background:#e9e9ec;color:var(--text)}
    button.sage{background:var(--sage);color:#fff}

    .panel{
      background:var(--card);
      border-radius:20px;
      box-shadow:var(--shadow);
      overflow:hidden;
      margin-bottom:16px;
    }

    .panel-head{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:10px;
      padding:16px 18px 12px;
    }

    .panel-title{
      margin:0;
      font-size:19px;
      line-height:1.2;
      font-weight:800;
      letter-spacing:-.01em;
    }

    .general-add{
      display:flex;
      gap:8px;
      padding:0 14px 14px;
    }

    .general-add input,
    .modal input,
    .edit-input{
      width:100%;
      min-width:0;
      border:1px solid var(--line);
      border-radius:13px;
      background:#fff;
      color:var(--text);
      min-height:44px;
      padding:10px 12px;
      outline:none;
      font-size:16px;
    }

    .general-add input:focus,
    .modal input:focus,
    .edit-input:focus{border-color:#b7b7bd}

    .general-empty{
      color:var(--muted);
      padding:0 18px 16px;
      font-size:14px;
    }

    .status{
      position:sticky;
      top:max(8px,env(safe-area-inset-top));
      z-index:20;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:12px;
      padding:14px 16px;
      margin:14px 0;
      background:rgba(255,255,255,.92);
      backdrop-filter:blur(18px);
      -webkit-backdrop-filter:blur(18px);
      border:1px solid rgba(0,0,0,.05);
      border-radius:18px;
      box-shadow:var(--shadow);
    }

    .status-label{
      color:var(--muted);
      font-size:12px;
      text-transform:uppercase;
      letter-spacing:.08em;
      margin-bottom:2px;
      font-weight:700;
    }

    .counter{
      font-size:22px;
      line-height:1.1;
      font-weight:800;
    }

    .view-switch{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:4px;
      padding:4px;
      margin-bottom:12px;
      border-radius:14px;
      background:#e9e9ec;
    }

    .view-switch button{
      min-height:42px;
      padding:8px 10px;
      border-radius:11px;
      background:transparent;
      color:var(--muted);
    }

    .view-switch button.active{
      background:#fff;
      color:var(--text);
      box-shadow:0 1px 5px rgba(0,0,0,.08);
    }

    .toolbar{
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap:8px;
      margin-bottom:16px;
    }

    .toolbar-left,.toolbar-right{
      display:flex;
      gap:8px;
      align-items:center;
    }

    body.editing #editBtn{
      position:fixed;
      right:max(16px,env(safe-area-inset-right));
      bottom:max(16px,env(safe-area-inset-bottom));
      z-index:90;
      min-width:110px;
      min-height:52px;
      box-shadow:0 10px 28px rgba(0,0,0,.22);
      background:var(--sage);
      color:#fff;
    }

    .view{display:none}
    .view.active{display:block}

    .group-label{
      margin:20px 4px 10px;
      color:var(--muted);
      font-size:13px;
      font-weight:800;
      text-transform:uppercase;
      letter-spacing:.08em;
    }

    .completed-toggle{
      width:100%;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:12px;
      margin:20px 0 10px;
      padding:12px 14px;
      border-radius:14px;
      background:#e9e9ec;
      color:var(--text);
      min-height:46px;
    }

    .completed-toggle-left{
      display:flex;
      align-items:center;
      gap:9px;
      font-size:14px;
      font-weight:800;
      text-transform:uppercase;
      letter-spacing:.06em;
    }

    .chevron{
      display:inline-block;
      transition:transform .18s ease;
      font-size:16px;
      line-height:1;
    }

    .completed-toggle.open .chevron{transform:rotate(90deg)}
    .completed-count{color:var(--muted);font-size:13px;font-weight:800}
    .completed-list{display:none}
    .completed-list.open{display:block}

    .factory-card{
      background:var(--card);
      border-radius:20px;
      box-shadow:var(--shadow);
      overflow:hidden;
      margin-bottom:16px;
    }

    .factory-card.completed{
      background:var(--sage);
      color:#fff;
    }

    .factory-card.completed .factory-sub,
    .factory-card.completed .pending-badge{color:rgba(255,255,255,.83)}

    .factory-card.completed .task{border-top-color:rgba(255,255,255,.16)}
    .factory-card.completed .task.done{background:rgba(255,255,255,.08)}
    .factory-card.completed .task.done .task-text{color:rgba(255,255,255,.92)}

    .factory-head{
      display:flex;
      align-items:center;
      gap:10px;
      padding:15px 16px 11px;
    }

    .factory-title-wrap{flex:1;min-width:0}

    .factory-title{
      font-size:18px;
      line-height:1.2;
      font-weight:800;
      letter-spacing:-.01em;
    }

    .factory-sub{
      margin-top:3px;
      color:var(--muted);
      font-size:13px;
      font-weight:700;
    }

    .factory-head-actions{
      display:flex;
      align-items:center;
      gap:8px;
    }

    .pending-badge{
      color:var(--muted);
      font-size:13px;
      font-weight:800;
      white-space:nowrap;
    }

    .complete-factory-btn{
      width:40px;
      height:40px;
      min-width:40px;
      min-height:40px;
      padding:0;
      border-radius:50%;
      display:grid;
      place-items:center;
      background:var(--sage);
      color:#fff;
      font-size:20px;
      font-weight:900;
      box-shadow:0 1px 5px rgba(0,0,0,.08);
    }

    .factory-card.completed .complete-factory-btn{
      background:rgba(255,255,255,.18);
      color:#fff;
    }

    .task{
      position:relative;
      display:flex;
      align-items:center;
      gap:12px;
      min-height:60px;
      padding:11px 16px;
      border-top:1px solid var(--line);
      background:transparent;
      user-select:none;
      -webkit-user-select:none;
    }

    .task-label{
      flex:1;
      min-width:0;
      display:flex;
      align-items:center;
      gap:14px;
      cursor:pointer;
    }

    .task input[type="checkbox"]{
      position:absolute;
      opacity:0;
      pointer-events:none;
    }

    .checkmark{
      width:30px;
      height:30px;
      flex:0 0 30px;
      border-radius:9px;
      border:2px solid #b8b8bd;
      display:grid;
      place-items:center;
      background:#fff;
      transition:all .15s ease;
    }

    .checkmark::after{
      content:"";
      width:8px;
      height:14px;
      border:solid #fff;
      border-width:0 3px 3px 0;
      transform:rotate(45deg) scale(0);
      margin-top:-2px;
      transition:transform .12s ease;
    }

    .task input:checked + .checkmark{
      background:var(--accent);
      border-color:var(--accent);
    }

    .task input:checked + .checkmark::after{transform:rotate(45deg) scale(1)}

    .task-text{
      flex:1;
      min-width:0;
      font-size:17px;
      line-height:1.3;
      font-weight:600;
    }

    .task.done{background:var(--accent-soft)}
    .task.done .task-text{color:var(--muted);text-decoration:line-through}

    .general-row.done{background:#eff1ed}

    .general-delete{
      display:none;
      background:transparent;
      color:var(--danger);
      min-height:34px;
      padding:5px 3px;
      font-size:13px;
    }

    .general-row.done .general-delete{display:inline-flex;align-items:center}

    .completed-divider{
      padding:9px 16px 5px;
      color:var(--muted);
      font-size:12px;
      font-weight:800;
      text-transform:uppercase;
      letter-spacing:.07em;
      border-top:1px solid var(--line);
    }

    .swipe-wrap{
      position:relative;
      overflow:hidden;
      background:var(--danger);
      border-top:1px solid var(--line);
    }

    .swipe-wrap:first-child{border-top:0}

    .swipe-delete{
      position:absolute;
      right:0;
      top:0;
      bottom:0;
      width:92px;
      display:grid;
      place-items:center;
      color:#fff;
      font-size:14px;
      font-weight:800;
    }

    .swipe-wrap .general-row{
      position:relative;
      z-index:2;
      border-top:0;
      background:#fff;
      transition:transform .18s ease;
    }

    .swipe-wrap .general-row.done{background:#eff1ed}
    .swipe-wrap .general-row.revealed{transform:translateX(-92px)}

    .product-card{
      background:var(--card);
      border-radius:20px;
      box-shadow:var(--shadow);
      overflow:hidden;
      margin-bottom:16px;
    }

    .product-head{
      padding:16px 18px 10px;
      font-size:18px;
      font-weight:800;
    }

    .empty{
      padding:18px;
      color:var(--muted);
      background:var(--card);
      border-radius:16px;
      box-shadow:var(--shadow);
    }

    .all-done{
      display:none;
      margin-bottom:16px;
      padding:18px;
      text-align:center;
      border-radius:18px;
      background:#eff1ed;
      color:var(--sage);
      font-weight:800;
    }

    .all-done.visible{display:block}

    body.editing .factory-card{
      background:#fff;
      color:var(--text);
    }

    body.editing .factory-card.completed .task{border-top-color:var(--line)}

    .edit-input{
      font-weight:600;
      min-height:40px;
      padding:7px 9px;
    }

    .factory-name-input{
      border:2px solid var(--sage);
      background:var(--sage-soft);
      font-weight:850;
      color:var(--text);
    }

    .factory-edit-label{
      display:block;
      margin-bottom:5px;
      color:var(--sage);
      font-size:11px;
      font-weight:900;
      text-transform:uppercase;
      letter-spacing:.08em;
    }

    .task-name-input{
      border:1px solid var(--line);
      background:#fff;
      font-weight:600;
    }

    .add-input-row{
      display:none;
      padding:10px 14px 14px;
      border-top:1px solid var(--line);
    }

    body.editing .add-input-row{display:block}

    .add-input-btn{
      width:100%;
      min-height:40px;
      background:#efeff2;
      color:var(--text);
      border-radius:12px;
    }

    .version-label{
      margin:28px 0 4px;
      text-align:center;
      color:#9a9aa0;
      font-size:11px;
      font-weight:700;
      letter-spacing:.04em;
    }

    .modal-backdrop{
      position:fixed;
      inset:0;
      z-index:100;
      display:none;
      align-items:flex-end;
      justify-content:center;
      padding:20px max(14px,env(safe-area-inset-right))
              max(20px,env(safe-area-inset-bottom))
              max(14px,env(safe-area-inset-left));
      background:rgba(0,0,0,.34);
    }

    .modal-backdrop.open{display:flex}

    .modal{
      width:min(560px,100%);
      padding:18px;
      border-radius:22px;
      background:#fff;
      box-shadow:0 20px 60px rgba(0,0,0,.22);
    }

    .modal h3{margin:0 0 14px;font-size:20px}

    .modal label{
      display:block;
      margin:12px 0 6px;
      color:var(--muted);
      font-size:13px;
      font-weight:800;
    }

    .modal-actions{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:8px;
      margin-top:16px;
    }

    .modal-actions .cancel{background:#ededf0;color:var(--text)}

    @media (min-width:700px){
      .modal-backdrop{align-items:center}
    }

    @media (max-width:420px){
      .counter{font-size:20px}
      .status{padding:12px 13px}
      button{padding-inline:12px}
      .general-delete{display:none !important}
      .factory-head{align-items:flex-start}
      .toolbar{align-items:stretch}
      .toolbar-left,.toolbar-right{align-items:stretch}
    }
  </style>
</head>

<body>
  <main class="app">
    <header>
      <h1>FS25 · Checklist diario</h1>
    </header>

    <section class="panel">
      <div class="panel-head">
        <h2 class="panel-title">Tareas generales</h2>
      </div>

      <div class="general-add">
        <input id="generalTaskInput" type="text" placeholder="Añadir tarea general" autocomplete="off">
        <button id="addGeneralTaskBtn" type="button">Añadir</button>
      </div>

      <div id="generalList"></div>
      <div id="generalEmpty" class="general-empty">No hay tareas generales.</div>
    </section>

    <section class="status">
      <div>
        <div class="status-label">Estado del día</div>
        <div id="counter" class="counter">0 pendientes</div>
      </div>
      <button id="resetBtn" type="button">Nuevo día</button>
    </section>

    <nav class="view-switch">
      <button id="factoryViewBtn" class="active" type="button">Por fábrica</button>
      <button id="productViewBtn" type="button">Por producto</button>
    </nav>

    <div class="toolbar">
      <div class="toolbar-left">
        <button id="newFactoryBtn" class="sage" type="button">＋ Nueva fábrica</button>
      </div>
      <div class="toolbar-right">
        <button id="editBtn" class="secondary" type="button">Editar</button>
      </div>
    </div>

    <div id="allDone" class="all-done">Todas las fábricas están revisadas.</div>

    <div id="factoryView" class="view active"></div>
    <div id="productView" class="view"></div>

    <div class="version-label">V3.1</div>
  </main>

  <div id="modalBackdrop" class="modal-backdrop" role="dialog" aria-modal="true">
    <div class="modal">
      <h3 id="modalTitle">Nueva fábrica</h3>
      <div id="modalFields"></div>
      <div class="modal-actions">
        <button id="modalCancelBtn" class="cancel" type="button">Cancelar</button>
        <button id="modalSaveBtn" type="button">Guardar</button>
      </div>
    </div>
  </div>

  <script>
    const CATALOG_KEY = "fs25-catalog-v30";
    const DAILY_KEY = "fs25-daily-v30";
    const GENERAL_KEY = "fs25-general-v30";
    const VIEW_KEY = "fs25-view-v30";
    const MIGRATION_KEY = "fs25-migrated-v30";

    const initialCatalog = [
      {id:"azucarera",name:"Azucarera",tasks:[{id:"azucarera-remolacha",name:"Remolacha"},{id:"azucarera-sorgo",name:"Sorgo"}]},
      {id:"malteria",name:"Maltería",tasks:[{id:"malteria-cebada",name:"Cebada"},{id:"malteria-sorgo",name:"Sorgo"},{id:"malteria-trigo",name:"Trigo"}]},
      {id:"aserradero",name:"Aserradero",tasks:[{id:"aserradero-madera",name:"Madera / troncos"}]},
      {id:"fermentador-pequeno",name:"Fermentador pequeño",tasks:[{id:"fermentador-hierba",name:"Hierba"}]},
      {id:"beet-pulp",name:"Beet Pulp",tasks:[{id:"beetpulp-remolacha",name:"Remolacha"},{id:"beetpulp-diesel",name:"Diésel"}]},
      {id:"taller",name:"Taller",tasks:[{id:"taller-diesel",name:"Diésel"}]},
      {id:"fabrica-semillas",name:"Fábrica de semillas",tasks:[{id:"semillas-trigo",name:"Trigo"},{id:"semillas-maiz",name:"Maíz"}]},
      {id:"holzfaller",name:"Holzfäller / Leñador",tasks:[{id:"holzfaller-diesel",name:"Diésel"}]},
      {id:"bga",name:"BGA",tasks:[{id:"bga-ensilaje",name:"Ensilaje"}]},
      {id:"harinera",name:"Harinera",tasks:[{id:"harinera-arroz-largo",name:"Arroz de grano largo"},{id:"harinera-arroz-normal",name:"Arroz normal"},{id:"harinera-trigo",name:"Trigo"}]},
      {id:"gallinas",name:"Gallinas",tasks:[{id:"gallinas-cereal",name:"Trigo, cebada o sorgo"},{id:"gallinas-huevos",name:"Recoger huevos"}]},
      {id:"vacas",name:"Vacas",tasks:[{id:"vacas-ensilado",name:"Ensilado"},{id:"vacas-heno",name:"Heno"},{id:"vacas-paja",name:"Paja"},{id:"vacas-mineral",name:"Alimento mineral"},{id:"vacas-paja-suelo",name:"Paja para suelo de vacas"},{id:"vacas-leche",name:"Recoger leche"},{id:"vacas-purin",name:"Recoger purín"},{id:"vacas-estiercol",name:"Recoger estiércol"}]},
      {id:"ovejas",name:"Ovejas",tasks:[{id:"ovejas-lana",name:"Recoger lana"}]},
      {id:"invernaderos",name:"Invernaderos",tasks:[{id:"invernaderos-miel",name:"Recoger miel"}]},
      {id:"ventas",name:"Ventas",tasks:[{id:"venta-lana",name:"Lana de ovejas"},{id:"venta-virutas",name:"Virutas de HOF o bosques"},{id:"venta-miel",name:"Miel de invernaderos"},{id:"venta-remolacha-cortada",name:"Remolacha cortada de fábrica"}]}
    ];

    let catalog = [];
    let dailyState = {};
    let generalTasks = [];
    let editing = false;
    let draftCatalog = null;
    let completedExpanded = false;

    const factoryView = document.getElementById("factoryView");
    const productView = document.getElementById("productView");
    const factoryViewBtn = document.getElementById("factoryViewBtn");
    const productViewBtn = document.getElementById("productViewBtn");
    const newFactoryBtn = document.getElementById("newFactoryBtn");
    const editBtn = document.getElementById("editBtn");
    const resetBtn = document.getElementById("resetBtn");
    const counter = document.getElementById("counter");
    const allDone = document.getElementById("allDone");
    const generalTaskInput = document.getElementById("generalTaskInput");
    const addGeneralTaskBtn = document.getElementById("addGeneralTaskBtn");
    const generalList = document.getElementById("generalList");
    const generalEmpty = document.getElementById("generalEmpty");
    const modalBackdrop = document.getElementById("modalBackdrop");
    const modalTitle = document.getElementById("modalTitle");
    const modalFields = document.getElementById("modalFields");
    const modalCancelBtn = document.getElementById("modalCancelBtn");
    const modalSaveBtn = document.getElementById("modalSaveBtn");

    function clone(v){return JSON.parse(JSON.stringify(v))}
    function uid(prefix){return prefix+"-"+Date.now().toString(36)+"-"+Math.random().toString(36).slice(2,8)}
    function readJSON(key,fallback){
      try{
        const raw=localStorage.getItem(key);
        return raw?JSON.parse(raw):fallback;
      }catch(e){return fallback}
    }
    function saveCatalog(){localStorage.setItem(CATALOG_KEY,JSON.stringify(catalog))}
    function saveDaily(){localStorage.setItem(DAILY_KEY,JSON.stringify(dailyState))}
    function saveGeneral(){localStorage.setItem(GENERAL_KEY,JSON.stringify(generalTasks))}
    function alphaCompare(a,b){return a.localeCompare(b,"es",{sensitivity:"base",numeric:true})}
    function sortCatalog(target){
      target.sort((a,b)=>alphaCompare(a.name,b.name));
      target.forEach(factory=>factory.tasks.sort((a,b)=>alphaCompare(a.name,b.name)));
      return target;
    }
    function ensureDailyKeys(){
      catalog.forEach(factory=>factory.tasks.forEach(task=>{
        if(typeof dailyState[task.id]!=="boolean") dailyState[task.id]=false;
      }));
    }
    function migrateV22(){
      if(localStorage.getItem(MIGRATION_KEY)) return;
      const oldDaily=readJSON("fs25-checklist-v22",null);
      if(oldDaily && typeof oldDaily==="object"){
        Object.keys(oldDaily).forEach(id=>dailyState[id]=Boolean(oldDaily[id]));
      }
      const oldNotes=localStorage.getItem("fs25-checklist-notes-v22");
      if(oldNotes && generalTasks.length===0){
        const lines=oldNotes.split("\n").map(line=>line.replace(/^\s*•\s?/,"").trim()).filter(Boolean);
        generalTasks=lines.map(text=>({id:uid("general"),text,done:false}));
      }
      localStorage.setItem(MIGRATION_KEY,"1");
      saveDaily();
      saveGeneral();
    }
    function loadData(){
      catalog=readJSON(CATALOG_KEY,clone(initialCatalog));
      dailyState=readJSON(DAILY_KEY,{});
      generalTasks=readJSON(GENERAL_KEY,[]);
      if(!Array.isArray(catalog) || catalog.length===0) catalog=clone(initialCatalog);
      if(!Array.isArray(generalTasks)) generalTasks=[];
      migrateV22();
      sortCatalog(catalog);
      ensureDailyKeys();
      saveCatalog();
      saveDaily();
    }
    function factoryComplete(factory){
      return factory.tasks.length>0 && factory.tasks.every(task=>Boolean(dailyState[task.id]));
    }
    function factoryPending(factory){return factory.tasks.filter(task=>!dailyState[task.id]).length}
    function totalPending(){return catalog.reduce((acc,factory)=>acc+factoryPending(factory),0)}
    function productName(taskName){return taskName.trim().replace(/^Recoger\s+/i,"") || taskName}

    function renderGeneral(){
      generalList.innerHTML="";
      const pending=generalTasks.filter(t=>!t.done);
      const done=generalTasks.filter(t=>t.done);
      generalEmpty.style.display=generalTasks.length?"none":"block";
      pending.forEach(task=>generalList.appendChild(makeGeneralRow(task)));
      if(done.length){
        const divider=document.createElement("div");
        divider.className="completed-divider";
        divider.textContent="Hechas";
        generalList.appendChild(divider);
        done.forEach(task=>generalList.appendChild(makeGeneralRow(task)));
      }
    }

    function makeGeneralRow(task){
      const wrap=document.createElement("div");
      wrap.className="swipe-wrap";
      const swipeDelete=document.createElement("div");
      swipeDelete.className="swipe-delete";
      swipeDelete.textContent="Eliminar";
      swipeDelete.addEventListener("click",()=>deleteGeneral(task.id));

      const row=document.createElement("div");
      row.className="task general-row"+(task.done?" done":"");
      const label=document.createElement("label");
      label.className="task-label";
      const input=document.createElement("input");
      input.type="checkbox";
      input.checked=task.done;
      const checkmark=document.createElement("span");
      checkmark.className="checkmark";
      const text=document.createElement("span");
      text.className="task-text";
      text.textContent=task.text;

      input.addEventListener("change",()=>{
        const item=generalTasks.find(t=>t.id===task.id);
        if(!item) return;
        item.done=input.checked;
        saveGeneral();
        renderGeneral();
      });

      label.append(input,checkmark,text);
      row.appendChild(label);

      if(task.done){
        const deleteBtn=document.createElement("button");
        deleteBtn.className="general-delete";
        deleteBtn.type="button";
        deleteBtn.textContent="Eliminar";
        deleteBtn.addEventListener("click",()=>deleteGeneral(task.id));
        row.appendChild(deleteBtn);
        bindSwipe(row);
      }

      wrap.append(swipeDelete,row);
      return wrap;
    }

    function bindSwipe(row){
      let startX=0,startY=0,tracking=false;
      row.addEventListener("touchstart",e=>{
        if(!e.touches || e.touches.length!==1) return;
        startX=e.touches[0].clientX;
        startY=e.touches[0].clientY;
        tracking=true;
      },{passive:true});
      row.addEventListener("touchmove",e=>{
        if(!tracking || !e.touches || e.touches.length!==1) return;
        const dx=e.touches[0].clientX-startX;
        const dy=e.touches[0].clientY-startY;
        if(Math.abs(dy)>Math.abs(dx)) return;
        if(dx<-28) row.classList.add("revealed");
        if(dx>20) row.classList.remove("revealed");
      },{passive:true});
      row.addEventListener("touchend",()=>tracking=false,{passive:true});
      row.addEventListener("touchcancel",()=>tracking=false,{passive:true});
    }

    function deleteGeneral(id){
      generalTasks=generalTasks.filter(t=>t.id!==id);
      saveGeneral();
      renderGeneral();
    }

    function addGeneral(){
      const text=generalTaskInput.value.trim();
      if(!text) return;
      generalTasks.push({id:uid("general"),text,done:false});
      generalTaskInput.value="";
      saveGeneral();
      renderGeneral();
    }

    function makeCheckTask(task,factoryName){
      const row=document.createElement("div");
      row.className="task"+(dailyState[task.id]?" done":"");
      const label=document.createElement("label");
      label.className="task-label";
      const input=document.createElement("input");
      input.type="checkbox";
      input.checked=Boolean(dailyState[task.id]);
      const checkmark=document.createElement("span");
      checkmark.className="checkmark";
      const text=document.createElement("span");
      text.className="task-text";
      text.textContent=factoryName || task.name;

      input.addEventListener("change",()=>{
        dailyState[task.id]=input.checked;
        saveDaily();
        renderAll();
      });

      label.append(input,checkmark,text);
      row.appendChild(label);
      return row;
    }

    function markFactoryComplete(factoryId){
      const factory=catalog.find(f=>f.id===factoryId);
      if(!factory) return;
      factory.tasks.forEach(task=>dailyState[task.id]=true);
      saveDaily();
      renderAll();
    }

    function renderFactoryView(){
      factoryView.innerHTML="";
      if(editing){
        renderEditFactoryView();
        return;
      }

      const pendingFactories=catalog.filter(f=>!factoryComplete(f));
      const completedFactories=catalog.filter(f=>factoryComplete(f));

      if(pendingFactories.length){
        const label=document.createElement("div");
        label.className="group-label";
        label.textContent="Pendientes";
        factoryView.appendChild(label);
        pendingFactories.forEach(factory=>factoryView.appendChild(makeFactoryCard(factory,false)));
      }

      if(completedFactories.length){
        const toggle=document.createElement("button");
        toggle.type="button";
        toggle.className="completed-toggle"+(completedExpanded?" open":"");

        const left=document.createElement("div");
        left.className="completed-toggle-left";

        const chevron=document.createElement("span");
        chevron.className="chevron";
        chevron.textContent="›";

        const title=document.createElement("span");
        title.textContent="Completadas";

        left.append(chevron,title);

        const count=document.createElement("span");
        count.className="completed-count";
        count.textContent=completedFactories.length;

        toggle.append(left,count);

        const list=document.createElement("div");
        list.className="completed-list"+(completedExpanded?" open":"");
        completedFactories.forEach(factory=>list.appendChild(makeFactoryCard(factory,true)));

        toggle.addEventListener("click",()=>{
          completedExpanded=!completedExpanded;
          renderFactoryView();
        });

        factoryView.append(toggle,list);
      }

      if(catalog.length===0){
        const empty=document.createElement("div");
        empty.className="empty";
        empty.textContent="Todavía no hay fábricas.";
        factoryView.appendChild(empty);
      }
    }

    function makeFactoryCard(factory,completed){
      const card=document.createElement("section");
      card.className="factory-card"+(completed?" completed":"");

      const head=document.createElement("div");
      head.className="factory-head";

      const titleWrap=document.createElement("div");
      titleWrap.className="factory-title-wrap";

      const title=document.createElement("div");
      title.className="factory-title";
      title.textContent=factory.name;

      const sub=document.createElement("div");
      sub.className="factory-sub";
      sub.textContent=factory.tasks.length===1?"1 tarea":`${factory.tasks.length} tareas`;

      titleWrap.append(title,sub);
      head.appendChild(titleWrap);

      const actions=document.createElement("div");
      actions.className="factory-head-actions";

      const pending=document.createElement("div");
      pending.className="pending-badge";
      const count=factoryPending(factory);
      pending.textContent=completed?"✓":(count===1?"1 pendiente":`${count} pendientes`);

      const completeBtn=document.createElement("button");
      completeBtn.className="complete-factory-btn";
      completeBtn.type="button";
      completeBtn.textContent="✓";
      completeBtn.setAttribute("aria-label",`Marcar todos los inputs de ${factory.name} como completados`);
      completeBtn.addEventListener("click",()=>markFactoryComplete(factory.id));

      actions.append(pending,completeBtn);
      head.appendChild(actions);
      card.appendChild(head);

      const tasks=[...factory.tasks].sort((a,b)=>{
        const ad=Boolean(dailyState[a.id]);
        const bd=Boolean(dailyState[b.id]);
        if(ad!==bd) return ad?1:-1;
        return alphaCompare(a.name,b.name);
      });

      tasks.forEach(task=>card.appendChild(makeCheckTask(task)));
      return card;
    }

    function renderEditFactoryView(){
      const label=document.createElement("div");
      label.className="group-label";
      label.textContent="Editar fábricas";
      factoryView.appendChild(label);

      draftCatalog.forEach(factory=>{
        const card=document.createElement("section");
        card.className="factory-card";

        const head=document.createElement("div");
        head.className="factory-head";

        const titleWrap=document.createElement("div");
        titleWrap.className="factory-title-wrap";

        const factoryLabel=document.createElement("span");
        factoryLabel.className="factory-edit-label";
        factoryLabel.textContent="Fábrica";

        const factoryInput=document.createElement("input");
        factoryInput.className="edit-input factory-name-input";
        factoryInput.value=factory.name;
        factoryInput.dataset.factoryId=factory.id;

        titleWrap.append(factoryLabel,factoryInput);
        head.appendChild(titleWrap);
        card.appendChild(head);

        [...factory.tasks].sort((a,b)=>alphaCompare(a.name,b.name)).forEach(task=>{
          const row=document.createElement("div");
          row.className="task";

          const input=document.createElement("input");
          input.className="edit-input task-name-input";
          input.value=task.name;
          input.dataset.factoryId=factory.id;
          input.dataset.taskId=task.id;

          row.appendChild(input);
          card.appendChild(row);
        });

        const addRow=document.createElement("div");
        addRow.className="add-input-row";

        const addBtn=document.createElement("button");
        addBtn.type="button";
        addBtn.className="add-input-btn";
        addBtn.textContent="＋ Añadir input";
        addBtn.addEventListener("click",()=>{
          syncDraftNamesFromDOM();
          openAddInput(factory.id);
        });

        addRow.appendChild(addBtn);
        card.appendChild(addRow);

        factoryView.appendChild(card);
      });
    }

    function syncDraftNamesFromDOM(){
      if(!editing || !draftCatalog) return;

      document.querySelectorAll(".factory-name-input").forEach(input=>{
        const factory=draftCatalog.find(f=>f.id===input.dataset.factoryId);
        if(factory && input.value.trim()) factory.name=input.value.trim();
      });

      document.querySelectorAll(".task-name-input").forEach(input=>{
        const factory=draftCatalog.find(f=>f.id===input.dataset.factoryId);
        const task=factory?.tasks.find(t=>t.id===input.dataset.taskId);
        if(task && input.value.trim()) task.name=input.value.trim();
      });
    }

    function beginEdit(){
      editing=true;
      draftCatalog=clone(catalog);
      document.body.classList.add("editing");
      editBtn.textContent="Guardar";
      editBtn.classList.remove("secondary");
      editBtn.classList.add("sage");
      renderFactoryView();
    }

    function saveEdit(){
      syncDraftNamesFromDOM();
      sortCatalog(draftCatalog);
      catalog=clone(draftCatalog);
      editing=false;
      draftCatalog=null;

      document.body.classList.remove("editing");
      editBtn.textContent="Editar";
      editBtn.classList.remove("sage");
      editBtn.classList.add("secondary");

      ensureDailyKeys();
      saveCatalog();
      saveDaily();
      renderAll();
    }

    function renderProductView(){
      productView.innerHTML="";
      const products={};

      catalog.forEach(factory=>{
        factory.tasks.forEach(task=>{
          const product=productName(task.name);
          if(!products[product]) products[product]=[];
          products[product].push({factory,task});
        });
      });

      const keys=Object.keys(products).sort((a,b)=>alphaCompare(a,b));

      if(keys.length===0){
        const empty=document.createElement("div");
        empty.className="empty";
        empty.textContent="Todavía no hay productos.";
        productView.appendChild(empty);
        return;
      }

      keys.forEach(product=>{
        const card=document.createElement("section");
        card.className="product-card";

        const head=document.createElement("div");
        head.className="product-head";
        head.textContent=product;
        card.appendChild(head);

        const items=products[product].sort((a,b)=>{
          const ad=Boolean(dailyState[a.task.id]);
          const bd=Boolean(dailyState[b.task.id]);
          if(ad!==bd) return ad?1:-1;
          return alphaCompare(a.factory.name,b.factory.name);
        });

        items.forEach(({factory,task})=>card.appendChild(makeCheckTask(task,factory.name)));
        productView.appendChild(card);
      });
    }

    function updateCounter(){
      const pending=totalPending();
      counter.textContent=pending===1?"1 pendiente":`${pending} pendientes`;
      allDone.classList.toggle("visible",catalog.length>0 && pending===0);
    }

    function renderAll(){
      renderGeneral();
      renderFactoryView();
      renderProductView();
      updateCounter();
    }

    function setView(view,save=true){
      const factory=view!=="product";
      factoryView.classList.toggle("active",factory);
      productView.classList.toggle("active",!factory);
      factoryViewBtn.classList.toggle("active",factory);
      productViewBtn.classList.toggle("active",!factory);
      newFactoryBtn.style.display=factory?"inline-flex":"none";
      editBtn.style.display=factory?"inline-flex":"none";
      if(save) localStorage.setItem(VIEW_KEY,factory?"factory":"product");
    }

    function openModal(title,fields,onSave){
      modalTitle.textContent=title;
      modalFields.innerHTML="";

      fields.forEach(field=>{
        const label=document.createElement("label");
        label.textContent=field.label;

        const input=document.createElement("input");
        input.type="text";
        input.id=field.id;
        input.placeholder=field.placeholder || "";
        input.value=field.value || "";

        modalFields.append(label,input);
      });

      modalSaveBtn.onclick=onSave;
      modalBackdrop.classList.add("open");

      setTimeout(()=>{
        const first=modalFields.querySelector("input");
        if(first) first.focus();
      },50);
    }

    function closeModal(){
      modalBackdrop.classList.remove("open");
      modalSaveBtn.onclick=null;
    }

    function openNewFactory(){
      if(editing) syncDraftNamesFromDOM();

      openModal("Nueva fábrica",[
        {id:"newFactoryName",label:"Nombre de la fábrica",placeholder:"Ej. Cervecería"},
        {id:"newFactoryTask",label:"Primer input (opcional)",placeholder:"Ej. Cebada"}
      ],()=>{
        const name=document.getElementById("newFactoryName").value.trim();
        const firstTask=document.getElementById("newFactoryTask").value.trim();
        if(!name) return;

        const target=editing?draftCatalog:catalog;
        const factory={id:uid("factory"),name,tasks:[]};

        if(firstTask){
          const taskId=uid("task");
          factory.tasks.push({id:taskId,name:firstTask});
          dailyState[taskId]=false;
        }

        target.push(factory);
        sortCatalog(target);

        if(!editing){
          catalog=target;
          saveCatalog();
          ensureDailyKeys();
          saveDaily();
          renderAll();
        }else{
          saveDaily();
          renderFactoryView();
        }

        closeModal();
      });
    }

    function openAddInput(factoryId){
      const factory=draftCatalog.find(f=>f.id===factoryId);
      if(!factory) return;

      openModal(`Añadir input · ${factory.name}`,[
        {id:"newInputName",label:"Nombre del input / tarea",placeholder:"Ej. Diésel"}
      ],()=>{
        const name=document.getElementById("newInputName").value.trim();
        if(!name) return;

        const taskId=uid("task");
        factory.tasks.push({id:taskId,name});
        factory.tasks.sort((a,b)=>alphaCompare(a.name,b.name));

        dailyState[taskId]=false;
        saveDaily();

        closeModal();
        renderFactoryView();
      });
    }

    addGeneralTaskBtn.addEventListener("click",addGeneral);

    generalTaskInput.addEventListener("keydown",e=>{
      if(e.key==="Enter"){
        e.preventDefault();
        addGeneral();
      }
    });

    factoryViewBtn.addEventListener("click",()=>{
      if(editing) saveEdit();
      setView("factory");
    });

    productViewBtn.addEventListener("click",()=>{
      if(editing) saveEdit();
      setView("product");
    });

    newFactoryBtn.addEventListener("click",openNewFactory);

    editBtn.addEventListener("click",()=>{
      if(editing) saveEdit();
      else beginEdit();
    });

    resetBtn.addEventListener("click",()=>{
      if(editing) saveEdit();
      if(!confirm("¿Empezar un nuevo día?")) return;

      generalTasks=generalTasks.filter(task=>!task.done);
      saveGeneral();

      catalog.forEach(factory=>factory.tasks.forEach(task=>dailyState[task.id]=false));
      saveDaily();

      completedExpanded=false;
      renderAll();

      window.scrollTo({top:0,behavior:"smooth"});
    });

    modalCancelBtn.addEventListener("click",closeModal);

    modalBackdrop.addEventListener("click",e=>{
      if(e.target===modalBackdrop) closeModal();
    });

    loadData();
    renderAll();
    setView(localStorage.getItem(VIEW_KEY)||"factory",false);

    if("serviceWorker" in navigator){
      window.addEventListener("load",()=>{
        navigator.serviceWorker.register("./service-worker.js");
      });
    }
  </script>
</body>
</html>
