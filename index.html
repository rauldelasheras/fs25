<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="FS25 Tareas">
<meta name="theme-color" content="#f5f5f7">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<title>FS25 · Tareas</title>
<style>
:root{--bg:#f5f5f7;--card:#fff;--text:#1d1d1f;--muted:#6e6e73;--line:#e5e5ea;--sage:#6f736c;--sageSoft:#eef0ec;--purple:#eadfff;--purpleStrong:#aa86e8;--purpleText:#382b4d;--shadow:0 2px 14px rgba(0,0,0,.06)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",sans-serif}
body{min-height:100vh;padding:max(16px,env(safe-area-inset-top)) max(14px,env(safe-area-inset-right)) max(96px,env(safe-area-inset-bottom)) max(14px,env(safe-area-inset-left))}
.app{width:min(760px,100%);margin:auto}
h1{margin:6px 2px 16px;font-size:clamp(30px,7vw,42px);letter-spacing:-.035em}
button,input{font:inherit}
button{border:0;border-radius:14px;background:var(--text);color:#fff;min-height:44px;padding:10px 14px;font-weight:750}
button.secondary{background:#e9e9ec;color:var(--text)}
button.sage{background:var(--sage)}
.add{display:flex;gap:8px;margin-bottom:14px;padding:14px;border-radius:20px;background:#fff;box-shadow:var(--shadow)}
.add input{width:100%;min-width:0;min-height:46px;padding:10px 13px;border:1px solid var(--line);border-radius:13px;font-size:16px}
.status{position:sticky;top:max(8px,env(safe-area-inset-top));z-index:40;display:flex;align-items:center;justify-content:space-between;gap:12px;margin:14px 0 18px;padding:14px 16px;border-radius:18px;background:rgba(255,255,255,.94);backdrop-filter:blur(18px);box-shadow:var(--shadow)}
.status-label{color:var(--muted);font-size:12px;font-weight:750;text-transform:uppercase;letter-spacing:.08em}
.counter{margin-top:2px;font-size:22px;font-weight:850}
.section-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:18px 4px 10px}
.section-title{margin:0;color:var(--muted);font-size:13px;font-weight:850;text-transform:uppercase;letter-spacing:.08em}
.clear{min-height:36px;padding:7px 11px;border-radius:11px;background:#e9e9ec;color:var(--text);font-size:13px}
.task-card{margin-bottom:10px;border-radius:18px;overflow:hidden;background:#fff;box-shadow:var(--shadow);touch-action:pan-y}
.task-content{display:flex;align-items:center;gap:12px;min-height:64px;padding:13px 16px;background:#fff;transition:transform .15s ease,background .15s ease;user-select:none}
.task-card.priority .task-content{background:var(--purple);border-left:4px solid var(--purpleStrong);color:var(--purpleText)}
.task-card.completed .task-content{background:var(--sageSoft);color:var(--muted)}
.task-card.completed.priority .task-content{background:var(--purple);color:var(--purpleText)}
.check{width:30px;height:30px;flex:0 0 30px;border:2px solid #b8b8bd;border-radius:9px;background:#fff;display:grid;place-items:center}
.check:after{content:"";width:8px;height:14px;border:solid #fff;border-width:0 3px 3px 0;transform:rotate(45deg) scale(0);margin-top:-2px}
.completed .check{border-color:var(--sage);background:var(--sage)}
.completed .check:after{transform:rotate(45deg) scale(1)}
.textwrap{flex:1;min-width:0}.text{font-size:17px;font-weight:650;line-height:1.3;word-break:break-word}.completed .text{text-decoration:line-through}
.priority-note{margin-top:4px;color:#7654aa;font-size:11px;font-weight:850;text-transform:uppercase;letter-spacing:.05em}
.help{margin:-2px 4px 16px;color:var(--muted);font-size:12px;line-height:1.4}
.task-content{-webkit-touch-callout:none}
.drag-source{overflow:visible}
.drag-source .task-content{visibility:hidden}
.drag-ghost{position:fixed!important;z-index:9999!important;margin:0!important;pointer-events:none!important;opacity:.98;transform:scale(1.025);box-shadow:0 14px 36px rgba(0,0,0,.20)!important}
.drag-ghost .task-content{visibility:visible!important}
body.dragging-task{cursor:grabbing;overscroll-behavior:none}
.empty{padding:20px;border-radius:18px;background:#fff;color:var(--muted);text-align:center;box-shadow:var(--shadow)}
.backup-toggle{width:100%;display:flex;align-items:center;justify-content:space-between;margin-top:24px;padding:14px 16px;border-radius:18px;background:#fff;color:var(--text);box-shadow:var(--shadow)}
.backup-panel{display:none;margin-top:8px;padding:14px;border-radius:18px;background:#fff;box-shadow:var(--shadow)}.backup-panel.open{display:block}
.backup-buttons{display:grid;grid-template-columns:1fr 1fr;gap:8px}.note{margin:10px 2px 0;color:var(--muted);font-size:12px;line-height:1.4}
#file{display:none}.version{margin:28px 0 4px;text-align:center;color:#9a9aa0;font-size:11px;font-weight:700}
@media(max-width:480px){.status{padding:12px 13px}.counter{font-size:20px}.backup-buttons{grid-template-columns:1fr}}
</style>
</head>
<body>
<main class="app">
<h1>FS25 · Tareas</h1>

<section class="add">
<input id="newTask" placeholder="Añadir nueva tarea" autocomplete="off">
<button id="addBtn">Añadir</button>
</section>

<section class="status">
<div><div class="status-label">Estado</div><div id="counter" class="counter">0 tareas pendientes</div></div>
</section>

<div class="help">Mantén pulsada una tarea pendiente y arrástrala para cambiar su orden.</div>

<section>
<div class="section-head"><h2 class="section-title">Pendientes</h2></div>
<div id="pending"></div>
</section>

<section id="doneSection">
<div class="section-head"><h2 class="section-title">Completadas</h2><button id="clearBtn" class="clear">Limpiar</button></div>
<div id="done"></div>
</section>

<button id="backupToggle" class="backup-toggle"><span>› &nbsp; Copia de seguridad</span><span style="color:var(--muted);font-size:13px">JSON</span></button>
<section id="backupPanel" class="backup-panel">
<div class="backup-buttons">
<button id="exportBtn" class="sage">Exportar copia</button>
<button id="importBtn" class="secondary">Importar copia</button>
</div>
<div id="backupStatus" class="note">Guarda tareas, orden, prioridad y conserva también los datos industriales de la V3.3 como datos legacy.</div>
<input id="file" type="file" accept=".json,application/json">
</section>

<div class="version">V4.1</div>
</main>

<script>
const TASKS_KEY="fs25-general-v30";
const PRIORITY_KEY="fs25-priority-v321";
const BACKUP_META_KEY="fs25-backup-meta-v1";
const LEGACY_KEYS={catalog:"fs25-catalog-v30",dailyState:"fs25-daily-v30",view:"fs25-view-v30",autoState:"fs25-auto-v32",pendingState:"fs25-pending-v323"};

const LONG_PRESS_MS=430;
const SWIPE_TRIGGER=58;
const MOVE_CANCEL=12;

let tasks=[];
let priorityState={};
let backupOpen=false;
let suppressClickUntil=0;
let dragCard=null;
let dragGhost=null;
let dragOffsetY=0;

const $=id=>document.getElementById(id);

function readJSON(k,f){try{const r=localStorage.getItem(k);return r?JSON.parse(r):f}catch(e){return f}}
function clone(v){return JSON.parse(JSON.stringify(v))}
function uid(){return "task-"+Date.now().toString(36)+"-"+Math.random().toString(36).slice(2,8)}
function save(){localStorage.setItem(TASKS_KEY,JSON.stringify(tasks));localStorage.setItem(PRIORITY_KEY,JSON.stringify(priorityState))}
function normalize(a){return Array.isArray(a)?a.filter(x=>x&&typeof x.text==="string"&&x.text.trim()).map(x=>({id:x.id||uid(),text:x.text.trim(),done:!!x.done})):[]}

function load(){
  tasks=normalize(readJSON(TASKS_KEY,[]));
  priorityState=readJSON(PRIORITY_KEY,{});
  if(!priorityState||typeof priorityState!=="object")priorityState={};
  const ids=new Set(tasks.map(t=>t.id));
  Object.keys(priorityState).forEach(id=>{if(!ids.has(id))delete priorityState[id]});
  save();
  updateBackupStatus();
}

function pending(){return tasks.filter(t=>!t.done)}
function completed(){return tasks.filter(t=>t.done)}

function render(){
  const p=pending(),d=completed();
  $("pending").innerHTML="";
  $("done").innerHTML="";
  $("counter").textContent=p.length===1?"1 tarea pendiente":`${p.length} tareas pendientes`;
  $("doneSection").style.display=d.length?"block":"none";

  if(!p.length){
    const e=document.createElement("div");
    e.className="empty";
    e.textContent="No hay tareas pendientes.";
    $("pending").appendChild(e);
  }else{
    p.forEach(t=>$("pending").appendChild(card(t,false)));
  }

  d.forEach(t=>$("done").appendChild(card(t,true)));
}

function card(task,isDone){
  const c=document.createElement("div");
  c.className="task-card"+(task.done?" completed":"")+(priorityState[task.id]?" priority":"");
  c.dataset.id=task.id;

  const content=document.createElement("div");
  content.className="task-content";
  const check=document.createElement("span");
  check.className="check";
  const wrap=document.createElement("div");
  wrap.className="textwrap";
  const text=document.createElement("div");
  text.className="text";
  text.textContent=task.text;
  wrap.appendChild(text);

  if(priorityState[task.id]){
    const n=document.createElement("div");
    n.className="priority-note";
    n.textContent="Prioritaria";
    wrap.appendChild(n);
  }

  content.append(check,wrap);
  c.appendChild(content);

  content.addEventListener("contextmenu",e=>e.preventDefault());
  bindGestures(c,content,task.id,!isDone);

  content.addEventListener("click",e=>{
    if(Date.now()<suppressClickUntil){
      e.preventDefault();
      return;
    }
    toggleDone(task.id);
  });

  return c;
}

function bindGestures(cardEl,content,id,canDrag){
  let timer=null;
  let sx=0,sy=0,dx=0,dy=0;
  let horizontal=false;
  let dragging=false;

  function clearTimer(){
    if(timer){clearTimeout(timer);timer=null}
  }

  content.addEventListener("touchstart",e=>{
    if(e.touches.length!==1)return;
    const t=e.touches[0];
    sx=t.clientX;sy=t.clientY;dx=0;dy=0;horizontal=false;dragging=false;
    clearTimer();

    if(canDrag){
      timer=setTimeout(()=>{
        dragging=true;
        suppressClickUntil=Date.now()+800;
        startDrag(cardEl,sy);
      },LONG_PRESS_MS);
    }
  },{passive:true});

  content.addEventListener("touchmove",e=>{
    if(e.touches.length!==1)return;
    const t=e.touches[0];
    dx=t.clientX-sx;
    dy=t.clientY-sy;

    if(dragging){
      e.preventDefault();
      updateDrag(t.clientY);
      autoScroll(t.clientY);
      return;
    }

    if(Math.abs(dx)>MOVE_CANCEL&&Math.abs(dx)>Math.abs(dy)){
      clearTimer();
      horizontal=true;
      suppressClickUntil=Date.now()+450;
      content.style.transform=dx>0?`translateX(${Math.min(dx,24)}px)`:"";
      return;
    }

    if(Math.abs(dy)>MOVE_CANCEL){
      clearTimer();
    }
  },{passive:false});

  content.addEventListener("touchend",()=>{
    clearTimer();
    content.style.transform="";

    if(dragging){
      finishDrag();
      suppressClickUntil=Date.now()+800;
      return;
    }

    if(horizontal){
      if(dx>SWIPE_TRIGGER)togglePriority(id);
      suppressClickUntil=Date.now()+500;
    }
  },{passive:true});

  content.addEventListener("touchcancel",()=>{
    clearTimer();
    content.style.transform="";
    if(dragging)finishDrag();
    suppressClickUntil=Date.now()+500;
  },{passive:true});

  content.addEventListener("mousedown",e=>{
    if(e.button!==0)return;

    let mouseDown=true;
    let msx=e.clientX,msy=e.clientY,mdx=0,mdy=0;
    let mouseHorizontal=false;
    let mouseDragging=false;

    clearTimer();
    if(canDrag){
      timer=setTimeout(()=>{
        if(!mouseDown)return;
        mouseDragging=true;
        suppressClickUntil=Date.now()+800;
        startDrag(cardEl,msy);
      },LONG_PRESS_MS);
    }

    function move(ev){
      if(!mouseDown)return;
      mdx=ev.clientX-msx;
      mdy=ev.clientY-msy;

      if(mouseDragging){
        ev.preventDefault();
        updateDrag(ev.clientY);
        autoScroll(ev.clientY);
        return;
      }

      if(Math.abs(mdx)>MOVE_CANCEL&&Math.abs(mdx)>Math.abs(mdy)){
        clearTimer();
        mouseHorizontal=true;
        suppressClickUntil=Date.now()+450;
        content.style.transform=mdx>0?`translateX(${Math.min(mdx,24)}px)`:"";
        return;
      }

      if(Math.abs(mdy)>MOVE_CANCEL)clearTimer();
    }

    function up(){
      if(!mouseDown)return;
      mouseDown=false;
      clearTimer();
      content.style.transform="";
      window.removeEventListener("mousemove",move);
      window.removeEventListener("mouseup",up);

      if(mouseDragging){
        finishDrag();
        suppressClickUntil=Date.now()+800;
        return;
      }

      if(mouseHorizontal){
        if(mdx>SWIPE_TRIGGER)togglePriority(id);
        suppressClickUntil=Date.now()+500;
      }
    }

    window.addEventListener("mousemove",move);
    window.addEventListener("mouseup",up);
  });
}

function startDrag(cardEl,startY){
  if(dragCard)return;

  dragCard=cardEl;
  const rect=dragCard.getBoundingClientRect();
  dragOffsetY=Math.max(0,Math.min(rect.height,startY-rect.top));

  dragGhost=dragCard.cloneNode(true);
  dragGhost.classList.add("drag-ghost");
  dragGhost.style.left=`${rect.left}px`;
  dragGhost.style.top=`${rect.top}px`;
  dragGhost.style.width=`${rect.width}px`;
  dragGhost.style.height=`${rect.height}px`;

  document.body.appendChild(dragGhost);
  dragCard.classList.add("drag-source");
  document.body.classList.add("dragging-task");

  if(navigator.vibrate){
    try{navigator.vibrate(20)}catch(e){}
  }
}

function updateDrag(clientY){
  if(!dragCard||!dragGhost)return;

  dragGhost.style.top=`${clientY-dragOffsetY}px`;

  const list=$("pending");
  const siblings=[...list.querySelectorAll(".task-card:not(.drag-source)")];
  let inserted=false;

  for(const sibling of siblings){
    const rect=sibling.getBoundingClientRect();
    if(clientY<rect.top+rect.height/2){
      list.insertBefore(dragCard,sibling);
      inserted=true;
      break;
    }
  }

  if(!inserted)list.appendChild(dragCard);
}

function autoScroll(clientY){
  const edge=85;
  if(clientY<edge)window.scrollBy(0,-12);
  else if(clientY>window.innerHeight-edge)window.scrollBy(0,12);
}

function finishDrag(){
  if(!dragCard)return;

  const order=[...$("pending").querySelectorAll(".task-card")]
    .map(el=>el.dataset.id)
    .filter(Boolean);

  const pendingMap=new Map(tasks.filter(t=>!t.done).map(t=>[t.id,t]));
  const doneTasks=tasks.filter(t=>t.done);

  tasks=[...order.map(id=>pendingMap.get(id)).filter(Boolean),...doneTasks];

  dragCard.classList.remove("drag-source");
  if(dragGhost)dragGhost.remove();
  dragCard=null;
  dragGhost=null;
  dragOffsetY=0;
  document.body.classList.remove("dragging-task");

  save();
  render();
}

function togglePriority(id){
  if(priorityState[id])delete priorityState[id];
  else priorityState[id]=true;
  save();
  render();
}

function toggleDone(id){
  const t=tasks.find(x=>x.id===id);
  if(!t)return;

  t.done=!t.done;

  if(!t.done){
    tasks=tasks.filter(x=>x.id!==id);
    const firstDone=tasks.findIndex(x=>x.done);
    if(firstDone===-1)tasks.push(t);
    else tasks.splice(firstDone,0,t);
  }

  save();
  render();
}

function addTask(){
  const input=$("newTask");
  const text=input.value.trim();
  if(!text)return;

  const item={id:uid(),text,done:false};
  const firstDone=tasks.findIndex(t=>t.done);
  if(firstDone===-1)tasks.push(item);
  else tasks.splice(firstDone,0,item);

  input.value="";
  save();
  render();
  input.focus();
}

function clearDone(){
  const ids=completed().map(t=>t.id);
  tasks=tasks.filter(t=>!t.done);
  ids.forEach(id=>delete priorityState[id]);
  save();
  render();
}

function legacyData(){
  const o={};
  Object.entries(LEGACY_KEYS).forEach(([name,key])=>{
    const raw=localStorage.getItem(key);
    if(raw!==null){
      try{o[name]=JSON.parse(raw)}catch(e){o[name]=raw}
    }
  });
  return o;
}

function restoreLegacy(o){
  if(!o||typeof o!=="object")return;
  Object.entries(LEGACY_KEYS).forEach(([name,key])=>{
    if(Object.prototype.hasOwnProperty.call(o,name))localStorage.setItem(key,JSON.stringify(o[name]));
  });
}

function backupObject(){
  return {format:"FS25_TASKS_BACKUP",schemaVersion:1,appVersion:"4.1",exportedAt:new Date().toISOString(),tasks:clone(tasks),priorityState:clone(priorityState),legacyIndustrialData:legacyData()};
}

async function exportBackup(){
  const data=JSON.stringify(backupObject(),null,2);
  const name=`FS25-tareas-backup-${new Date().toISOString().slice(0,10)}.json`;
  const f=new File([data],name,{type:"application/json"});
  try{
    if(navigator.canShare&&navigator.canShare({files:[f]}))await navigator.share({files:[f],title:"FS25 Tareas backup"});
    else{
      const u=URL.createObjectURL(f),a=document.createElement("a");
      a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),1000);
    }
    localStorage.setItem(BACKUP_META_KEY,JSON.stringify({lastExport:new Date().toISOString()}));
    updateBackupStatus();
  }catch(e){if(e.name!=="AbortError")alert("No se pudo exportar la copia.")}
}

async function importBackup(file){
  try{
    const obj=JSON.parse(await file.text());
    const v4=obj&&obj.format==="FS25_TASKS_BACKUP"&&Array.isArray(obj.tasks);
    const v3=obj&&obj.format==="FS25_CHECKLIST_BACKUP"&&Array.isArray(obj.generalTasks);
    if(!v4&&!v3)throw new Error();

    if(v4){
      tasks=normalize(obj.tasks);
      priorityState=obj.priorityState&&typeof obj.priorityState==="object"?clone(obj.priorityState):{};
      restoreLegacy(obj.legacyIndustrialData);
    }else{
      tasks=normalize(obj.generalTasks);
      priorityState=obj.priorityState&&typeof obj.priorityState==="object"?clone(obj.priorityState):{};
      restoreLegacy({catalog:obj.catalog,dailyState:obj.dailyState,view:obj.view,autoState:obj.autoState,pendingState:obj.pendingState});
    }

    const ids=new Set(tasks.map(t=>t.id));
    Object.keys(priorityState).forEach(id=>{if(!ids.has(id))delete priorityState[id]});
    save();render();
    localStorage.setItem(BACKUP_META_KEY,JSON.stringify({lastImport:new Date().toISOString(),fileName:file.name}));
    updateBackupStatus();
    alert("Copia importada correctamente.");
  }catch(e){
    alert("El archivo no es una copia válida de FS25 Tareas.");
  }
}

function updateBackupStatus(){
  const m=readJSON(BACKUP_META_KEY,{});
  if(m.lastExport)$("backupStatus").textContent=`Última copia exportada: ${new Date(m.lastExport).toLocaleString("es-ES")}. Los datos industriales legacy también se conservan.`;
  else if(m.lastImport)$("backupStatus").textContent=`Última copia importada: ${new Date(m.lastImport).toLocaleString("es-ES")}.`;
}

$("addBtn").onclick=addTask;
$("newTask").onkeydown=e=>{if(e.key==="Enter"){e.preventDefault();addTask()}};
$("clearBtn").onclick=clearDone;
$("backupToggle").onclick=()=>{backupOpen=!backupOpen;$("backupPanel").classList.toggle("open",backupOpen)};
$("exportBtn").onclick=exportBackup;
$("importBtn").onclick=()=>$("file").click();
$("file").onchange=()=>{const f=$("file").files?.[0];if(f)importBackup(f);$("file").value=""};

load();
render();

if("serviceWorker" in navigator)window.addEventListener("load",()=>navigator.serviceWorker.register("./service-worker.js"));
</script>
</body>
</html>
