<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="FS25 Checklist"><meta name="theme-color" content="#f5f5f7"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon-180.png"><title>FS25 · Checklist diario</title><style>
:root{--bg:#f5f5f7;--card:#fff;--text:#1d1d1f;--muted:#6e6e73;--line:#e5e5ea;--accent:#0a7f3f;--soft:#e9f7ef;--shadow:0 2px 14px rgba(0,0,0,.06)}*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",sans-serif}body{min-height:100vh;padding:max(16px,env(safe-area-inset-top)) max(14px,env(safe-area-inset-right)) max(28px,env(safe-area-inset-bottom)) max(14px,env(safe-area-inset-left))}.app{width:min(760px,100%);margin:0 auto}header{margin:6px 2px 14px}h1{font-size:clamp(28px,7vw,40px);line-height:1.05;margin:0 0 14px;letter-spacing:-.03em}.notes{width:100%;min-height:86px;resize:vertical;border:1px solid var(--line);border-radius:16px;background:var(--card);color:var(--text);font:inherit;font-size:16px;line-height:1.4;padding:14px 15px;outline:none;box-shadow:var(--shadow)}.notes::placeholder{color:#9a9aa0}.status{position:sticky;top:max(8px,env(safe-area-inset-top));z-index:10;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 16px;margin:14px 0;background:rgba(255,255,255,.92);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border:1px solid rgba(0,0,0,.05);border-radius:18px;box-shadow:var(--shadow)}.status-label{color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.08em;margin-bottom:2px;font-weight:700}.counter{font-size:22px;font-weight:750;line-height:1.1}button{border:0;border-radius:14px;background:var(--text);color:white;font:inherit;font-weight:700;padding:12px 14px;min-height:44px;cursor:pointer;white-space:nowrap}.switch{display:grid;grid-template-columns:1fr 1fr;gap:4px;background:#e9e9ec;padding:4px;border-radius:14px;margin-bottom:16px}.switch button{min-height:42px;background:transparent;color:var(--muted);border-radius:11px;padding:8px 10px}.switch button.active{background:var(--card);color:var(--text);box-shadow:0 1px 5px rgba(0,0,0,.08)}.section{background:var(--card);border-radius:20px;overflow:hidden;box-shadow:var(--shadow);margin-bottom:16px}.section-title{padding:16px 18px 10px;font-size:18px;font-weight:800;letter-spacing:-.01em}.task{display:flex;align-items:center;gap:14px;min-height:62px;padding:12px 16px;border-top:1px solid var(--line);cursor:pointer;user-select:none;-webkit-user-select:none}.task input{position:absolute;opacity:0;pointer-events:none}.check{width:30px;height:30px;flex:0 0 30px;border-radius:9px;border:2px solid #b8b8bd;display:grid;place-items:center;background:white}.check:after{content:"";width:8px;height:14px;border:solid white;border-width:0 3px 3px 0;transform:rotate(45deg) scale(0);margin-top:-2px}.task input:checked+.check{background:var(--accent);border-color:var(--accent)}.task input:checked+.check:after{transform:rotate(45deg) scale(1)}.task-text{flex:1;min-width:0;font-size:17px;line-height:1.3;font-weight:600}.task.done{background:var(--soft)}.task.done .task-text{color:var(--muted);text-decoration:line-through}.done-msg{display:none;text-align:center;padding:18px;margin:0 0 16px;background:var(--soft);color:var(--accent);border-radius:18px;font-weight:800}.done-msg.visible{display:block}.view{display:none}.view.active{display:block}
</style></head><body><main class="app"><header><h1>FS25 · Checklist diario</h1><textarea id="notes" class="notes" placeholder="Notas rápidas: siguiente paso, compra pendiente, terreno, etc."></textarea></header><section class="status"><div><div class="status-label">Estado del día</div><div class="counter" id="counter">0 pendientes</div></div><button id="reset" type="button">Nuevo día</button></section><nav class="switch"><button id="byFactory" class="active">Por fábrica</button><button id="byProduct">Por producto</button></nav><div class="done-msg" id="doneMsg">Todo revisado para este día.</div><div id="factoryView" class="view active"></div><div id="productView" class="view"></div></main><script>
const STATE='fs25-checklist-v2',NOTES='fs25-notes-v2',VIEW='fs25-view-v2';
const groups=[
['Azucarera',[['az-rem','Remolacha','Remolacha'],['az-sor','Sorgo','Sorgo']]],
['Maltería',[['mal-ceb','Cebada','Cebada'],['mal-sor','Sorgo','Sorgo'],['mal-tri','Trigo','Trigo']]],
['Aserradero',[['ase-mad','Madera / troncos','Madera / troncos']]],
['Fermentador pequeño',[['fer-hie','Hierba','Hierba']]],
['Beet Pulp',[['bee-rem','Remolacha','Remolacha'],['bee-die','Diésel','Diésel']]],
['Taller',[['tal-die','Diésel','Diésel']]],
['Fábrica de semillas',[['sem-tri','Trigo','Trigo'],['sem-mai','Maíz','Maíz']]],
['Holzfäller / Leñador',[['hol-die','Diésel','Diésel']]],
['BGA',[['bga-ens','Ensilaje','Ensilaje']]],
['Harinera',[['har-lar','Arroz de grano largo','Arroz de grano largo'],['har-nor','Arroz normal','Arroz normal'],['har-tri','Trigo','Trigo']]],
['Gallinas',[['gal-cer','Trigo, cebada o sorgo','Trigo, cebada o sorgo']]],
['Vacas',[['vac-ens','Ensilado','Ensilado'],['vac-hen','Heno','Heno'],['vac-paj','Paja','Paja'],['vac-min','Alimento mineral','Alimento mineral'],['vac-sue','Paja para suelo de vacas','Paja para suelo de vacas'],['vac-lec','Recoger leche','Leche'],['vac-pur','Recoger purín','Purín'],['vac-est','Recoger estiércol','Estiércol']]],
['Recogidas',[['rec-lan','Palés de lana de ovejas','Lana de ovejas'],['rec-mie','Palés de miel de invernaderos','Miel de invernaderos']]],
['Ventas',[['ven-lan','Lana de ovejas','Lana de ovejas'],['ven-vir','Virutas de HOF o bosques','Virutas de HOF o bosques'],['ven-mie','Miel de invernaderos','Miel de invernaderos'],['ven-rem','Remolacha cortada de fábrica','Remolacha cortada']]]
];
const meta={};groups.forEach(([g,ts])=>ts.forEach(([id,label,product])=>meta[id]={id,label,product,group:g}));
const fv=document.getElementById('factoryView'),pv=document.getElementById('productView'),counter=document.getElementById('counter'),doneMsg=document.getElementById('doneMsg'),notes=document.getElementById('notes');
const read=()=>{try{return JSON.parse(localStorage.getItem(STATE)||'{}')}catch(e){return{}}};const write=s=>localStorage.setItem(STATE,JSON.stringify(s));
function row(id,text){const l=document.createElement('label');l.className='task';l.innerHTML=`<input type="checkbox" data-id="${id}"><span class="check"></span><span class="task-text"></span>`;l.querySelector('.task-text').textContent=text;return l}
function render(){groups.forEach(([g,ts])=>{const s=document.createElement('section');s.className='section';s.innerHTML=`<div class="section-title"></div>`;s.querySelector('.section-title').textContent=g;ts.forEach(([id,label])=>s.appendChild(row(id,label)));fv.appendChild(s)});const bp={};Object.values(meta).forEach(t=>(bp[t.product]??=[]).push(t));Object.keys(bp).sort((a,b)=>a.localeCompare(b,'es')).forEach(p=>{const s=document.createElement('section');s.className='section';s.innerHTML=`<div class="section-title"></div>`;s.querySelector('.section-title').textContent=p;bp[p].forEach(t=>s.appendChild(row(t.id,t.group)));pv.appendChild(s)})}
function sync(){const s=read();document.querySelectorAll('input[data-id]').forEach(cb=>{cb.checked=!!s[cb.dataset.id];cb.closest('.task').classList.toggle('done',cb.checked)});const ids=Object.keys(meta),pending=ids.filter(id=>!s[id]).length;counter.textContent=pending===1?'1 pendiente':`${pending} pendientes`;doneMsg.classList.toggle('visible',pending===0)}
function bind(){document.querySelectorAll('input[data-id]').forEach(cb=>cb.addEventListener('change',()=>{const s=read();s[cb.dataset.id]=cb.checked;write(s);sync()}))}
function setView(v){const f=v!=='product';fv.classList.toggle('active',f);pv.classList.toggle('active',!f);byFactory.classList.toggle('active',f);byProduct.classList.toggle('active',!f);localStorage.setItem(VIEW,f?'factory':'product')}
byFactory.onclick=()=>setView('factory');byProduct.onclick=()=>setView('product');notes.value=localStorage.getItem(NOTES)||'';notes.oninput=()=>localStorage.setItem(NOTES,notes.value);reset.onclick=()=>{if(!confirm('¿Empezar un nuevo día y desmarcar todas las tareas?'))return;write({});notes.value='';localStorage.removeItem(NOTES);sync();scrollTo({top:0,behavior:'smooth'})};render();bind();sync();setView(localStorage.getItem(VIEW)||'factory');if('serviceWorker'in navigator)addEventListener('load',()=>navigator.serviceWorker.register('./service-worker.js'));
</script></body></html>
